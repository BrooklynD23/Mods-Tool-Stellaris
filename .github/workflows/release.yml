name: Release

# On a `v*` tag: build the CLI for Windows (the target platform) and Linux, publish
# SHA256 sums, and attach everything to a DRAFT GitHub Release for manual review
# (doc 14 § Release process). Nothing is published without a human.
#
# NOT YET HERE (doc 15 § RE, gate H33): `--selftest` against registry.lock, the golden
# fixture scan, the real-playset ground-truth diff, provenance attestations, the musl
# static build, and code signing (blocked on the certificate; see the sign step).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: smd.exe
            asset: smd-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: smd
            asset: smd-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install stable
      - name: Build
        run: cargo build --release --locked -p smd-cli --bin smd
      - name: Sign (Windows)
        # BLOCKED (H33): no code-signing certificate exists yet. This step is a
        # placeholder that runs only once a SIGNING_CERT secret is configured; until then
        # the binary ships unsigned and SmartScreen warns (doc 14 § Code signing).
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
        run: |
          if [ -z "$SIGNING_CERT" ]; then
            echo "::warning::SIGNING_CERT not set; smd.exe is UNSIGNED (blocked on H33)"
            exit 0
          fi
          echo "::error::signing is not implemented yet; wire signtool / Trusted Signing here"
          exit 1
      - name: Stage artefact
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum smd-* > SHA256SUMS && cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft
          --title "$TAG" --generate-notes
