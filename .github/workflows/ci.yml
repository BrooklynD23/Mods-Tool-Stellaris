name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Stable for build, test, clippy, and release. Nightly exists for the `cargo-fuzz` job
# only, which lands at M2; no other job may require it (ADR-0001).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the dominant platform for this tool's users and the one every
        # platform-sensitive decision is budgeted on, so it is a first-class matrix entry
        # rather than an afterthought.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Test with every feature on
        run: cargo test --workspace --all-features
      - name: Test the contracts crate with no features
        run: cargo test -p smd-core --no-default-features

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Structural gates
        # File length, dependency direction against xtask/layers.toml, game names,
        # doc links, and the release-profile audit. Live from commit one: a size limit
        # added later is a limit that never gets enforced.
        # `cargo xtask` is the alias declared in `.cargo/config.toml`.
        run: cargo xtask lint
