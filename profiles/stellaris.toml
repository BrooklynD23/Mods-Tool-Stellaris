# Textually substituted at parse time, so a collision here propagates into every call
# site. Treated by Irony as a first-class Stellaris mechanism.

[benign]      # never worth reporting
paths = [
  "thumbnail.png",
  "descriptor.mod",
  "readme*",
  ".git/**",
  "*.md",
  "*.editorconfig",
]
