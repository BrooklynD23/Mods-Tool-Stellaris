# --- on_actions: the design's headline risk ------------------------------------

[[dir]]
glob   = "common/on_actions/**/*.txt"
domain = "on_action"
merge  = "unknown"
# OPEN BOX: docs/VERIFY.md V18, "Additive-body directories".
#
# DOUBLY GATED. Even once the child set is probed, merge_by_key_additive_body cannot be
# selected until the extractor emits AdditiveSplit facts (residual hash = body minus the
# additive children; architecture/03 Invariant A1, gate H4): a whole-body hash cannot tell
# "two mods add different events" (harmless) from "two mods disagree on a non-additive
# child" (an override). The loader rejects the mode without that extractor.
#
# What IS corroborated (wiki + Irony, independently): two mods hooking the same
# on_action in DIFFERENTLY NAMED files do not conflict — the events lists accumulate and
# fire in ASCII-betical filename order. So the feared ~200-participant false High is
# indeed false and this directory must not be treated as file replacement in general.
#
# What is NOT corroborated, and why this is `unknown` rather than
# merge_by_key_additive_body: only one source names any accumulating child, and it names
# only `events`. `effect` and `random_events` are unsupported guesses. Shipping
# additive_children = ["events", "effect", "random_events"] would assert two things
# nobody has checked.
#
# merge = "merge_by_key_additive_body"   # <- only once H4 lands AND a probe confirms
# additive_children = ["events"]         #    the set.
#
# Note the exception that survives whatever the answer is: two mods both shipping
# common/on_actions/00_on_actions.txt collide on filename identity, and the loser's whole
# file — including the vanilla content it was extending — is dropped. That IS a severe
# conflict and IS still reported: Stage A (same path) runs whatever `merge` says.

# --- Localisation ---------------------------------------------------------------

# Both localisation entries share scope = "loc", so their keys compete in one group; the
# more specific glob (replace/) classifies its own files and carries tier = 1.

[[dir]]
glob   = "localisation/**/*.yml"
domain = "loc"
parser = "pdx_locyml"
scope  = "loc"
merge  = "unknown"          # Irony parses per YAML key. Hypothesis: merge_by_key.
same_path = "unknown"       # VERIFY V39: whole-file replacement on an identical loc
                            # filename is not covered by any source; Irony keys loc per
                            # key. Probe P7. Overrides the [load_order] default.

[[dir]]
glob   = "localisation/replace/**/*.yml"
domain = "loc"
parser = "pdx_locyml"
scope  = "loc"
tier   = 1
merge  = "unknown"
same_path = "unknown"       # VERIFY V39, as above.
level  = 1
# OPEN BOX: docs/VERIFY.md V20. SINGLE SOURCE (Irony): for a given loc key, if ANY
# source defines it under a `replace` directory then every non-replace candidate is
# discarded, REGARDLESS of load order or filename; the unit is the individual YAML key.
# Expressed as tier = 1 in the shared "loc" scope — Stage D compares tier before anything
# else. The tier is stated (wrong costs one hedge per replace key); it only takes effect
# once `merge` for the "loc" scope is known, since Stage C does not resolve an unknown
# scope. Irony also excludes vanilla from the loc filename ordering (VERIFY V09).
tier_confidence = "single_source"

[[dir]]
glob   = "localisation_synced/**/*.yml"
domain = "loc_synced"
parser = "pdx_locyml"
merge  = "unknown"
same_path = "unknown"       # VERIFY V39.

# --- Non-script trees -----------------------------------------------------------

