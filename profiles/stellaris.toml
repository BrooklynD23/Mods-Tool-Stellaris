# profiles/stellaris.toml
#
# Game profile for Stellaris. Schema: docs/architecture/10-game-profiles.md.
#
# PROVENANCE: this file was authored in M0.5 from prior-art corroboration, NOT from
# observation of a running game. See docs/VERIFY.md for the finding behind every value
# and docs/GROUND-TRUTH-PRIOR-ART.md for the sources and their licences. Nothing here was
# copied from another project's config files; every value is restated from documented
# behaviour.
#
# RULES OBSERVED WHILE WRITING THIS FILE:
#   * `merge` is set only where docs/VERIFY.md records CORROBORATED (>= 2 independent
#     sources). Everything else is `merge = "unknown"`, which is a first-class answer.
#   * Every `merge = "unknown"` below maps to an open (unticked) box in
#     docs/VERIFY.md § Directory merge behaviour — principally
#     "For each [[dir]] entry in profiles/stellaris.toml, confirm the merge mode."
#     Entries with a more specific open box name it in a trailing comment.
#
# SCHEMA: the keys below follow the resolution model of docs/architecture/07 (file
# overlay -> surviving files -> key resolution -> precedence tuple) and are specified in
# docs/architecture/10 § "Keys, by resolution stage". The M0.5 proposals
# (same_filename_replaces_whole_file, the filename axis, per-dir `order`) are now schema,
# not proposals (REVIEW-2026-10, H1/H2/H6). A loader that does not understand a key MUST
# reject it loudly rather than ignore it — silently dropping `order = "fios"` inverts the
# verdict for fourteen directories.
#
# EVIDENCE: nothing in this file is empirically verified (docs/VERIFY.md, Oct 2026
# refresh). No [[dir]] carries `verified`, so every finding is at best
# SemanticCertainty::Assumed. `*_confidence` records prior-art strength for the reader;
# the resolver never reads it. Where a value would INVERT verdicts if wrong and rests on
# one source or none, it is "unknown" and the resolver enumerates its readings.
#
# `merge` values below are SINGLE SOURCE (Irony's per-directory parser table, VERIFY V14)
# unless the entry says merge_confidence = "corroborated". Only the general rule — per-key
# merging across differently-named files — is corroborated.

[game]
id       = "stellaris"
name     = "Stellaris"
steam_id = 281990

[locations]
# NOTE: {DOCUMENTS} MUST be resolved through the OS known-folder API
# (SHGetKnownFolderPath / FOLDERID_Documents), never by joining {USERPROFILE} + "Documents".
# OneDrive redirection repoints the known folder; string-joining silently misses every
# redirected user. See docs/VERIFY.md § Paths.
user_dir.windows = "{DOCUMENTS}/Paradox Interactive/Stellaris"
user_dir.linux   = "{XDG_DATA_HOME}/Paradox Interactive/Stellaris"
user_dir.macos   = "{HOME}/Documents/Paradox Interactive/Stellaris"
user_dir.proton  = "{PROTON_PREFIX}/drive_c/users/steamuser/Documents/Paradox Interactive/Stellaris"
workshop         = "{STEAM_LIB}/steamapps/workshop/content/281990"
install          = "{STEAM_LIB}/steamapps/common/Stellaris"
mods_subdir      = "mod"

# Steam libraries are discovered from libraryfolders.vdf in BOTH config/ and steamapps/.
# Whether the workshop may live in a different library from the game is NEEDS THE GAME,
# so the resolver must search every library rather than assume co-location.
steam_library_index = ["config/libraryfolders.vdf", "steamapps/libraryfolders.vdf"]

[load_order]
sources    = ["launcher_v2_sqlite", "dlc_load_json", "directory_scan"]

# --- Stage A: file overlay ---------------------------------------------------

# CORROBORATED (Irony, CWTools, community; VERIFY V15) for common/ and binary assets:
# where two sources ship the SAME root-relative path, the winner's file replaces the
# loser's wholesale — keys present only in the loser's copy are lost. Applies in every
# [[dir]] whatever its `merge`; a [[dir]] may override with `same_path = "unknown"`.
# Localisation is NOT covered by the sources (V39) and overrides below.
same_filename_replaces_whole_file = true
same_filename_confidence = "corroborated"

# UNKNOWN (VERIFY V10). Does replace_path drop vanilla only, or vanilla AND every earlier
# mod's content at that path? Irony implements the second, and its author says he is
# guessing. Vanilla shadowing is stated either way; earlier-mod shadowing is enumerated.
replace_path_scope = "unknown"      # vanilla_only | vanilla_and_earlier

# --- Stage D: precedence tuple (tier, filename key, rank, in-file ordinal) -----

# CORROBORATED (V01): for the SAME filename, a mod later in the playset beats an earlier
# one. This is the `rank` component only — it decides nothing between differently-named
# files, where the filename axis below comes first.
later_wins = true

# CORROBORATED for the same-path case only (CWTools' unit is the logical path; Irony
# strips vanilla on a shared filename). It is NOT established for differently-named
# files: see vanilla_in_filename_axis. Read by Stage A only.
vanilla_is_lowest = true

# UNKNOWN (VERIFY V09). Do vanilla's differently-named files take part in the filename
# axis? Irony (single source) says YES outside localisation: vanilla definitions are
# removed only on a shared filename and otherwise join the ordinal sort, so a mod
# redefining a vanilla trait from `zzz_x.txt` in a FIOS directory LOSES to vanilla's
# `00_` file. Inside localisation Irony excludes vanilla from the ordering. Unknown
# rather than "true" because one source contradicting a widely held belief is a
# reason to probe (P4), not to flip every verdict.
vanilla_in_filename_axis = "unknown"

# CORROBORATED that a filename axis exists and is ordinal (V21): case-sensitive byte
# order, 'Z' sorts before 'a'. Direction is per [[dir]] `order`, default below.
#   "lios" - last filename in ordinal order wins
#   "fios" - first filename in ordinal order wins
filename_compare = "ordinal"
default_order = "lios"

# UNKNOWN (VERIFY V37). What the filename axis compares. Irony (single source) uses the
# basename WITHOUT extension, grouping case-insensitively but sorting ordinally. Matters
# only for files in subdirectories or differing extensions. Probe P5.
filename_key = "unknown"            # basename_noext | basename | dir_relative

# UNKNOWN (VERIFY V38). The same key defined twice in ONE file: first or last wins?
# 4.5.1+ logs an error for duplicate database keys, which proves detection, not the
# winner. Probe P6.
in_file_duplicate = "unknown"       # first | last

[syntax]
script       = "clausewitz"
localisation = "pdx_locyml"
descriptor   = "clausewitz_kv"

# CORROBORATED (CWTools operator enum + Irony): exactly these eight, no others.
operators = ["=", "==", ">", "<", ">=", "<=", "!=", "?="]

# Stellaris's parameterisation mechanism is common/inline_scripts + `inline_script`
# invocation. The CK3-style "[[PARAM] ... ]" form is NOT confirmed for Stellaris and is
# deliberately absent — see docs/VERIFY.md § Syntax.
variables      = "at_prefix"        # @my_var
inline_scripts = true

# Encoding is not uniform even within one game: common/name_lists must be UTF-8 WITH BOM,
# other script paths must not be. Frequency of non-UTF-8 files in the wild is unmeasured.
encoding.default        = "utf8"
encoding.bom_required   = ["common/name_lists/**"]

[version]
# SINGLE SOURCE (Irony): launcher-settings.json sits in the INSTALL directory beside the
# executable. Read `rawVersion` first, fall back to `version` — Paradox is inconsistent
# about which is populated. Validate that the value parses before accepting it.
source  = "launcher-settings.json"
source_dir = "install"
fields  = ["rawVersion", "version"]
pattern = "wildcard_dotted"    # 3.13.*
# The set of supported_version wildcard shapes occurring in the wild is unresolved
# (docs/VERIFY.md § Version). Best resolved by scraping workshop descriptors, not by a
# probe mod. Until then the parser should accept unknown shapes rather than reject them.
pattern_forms_confirmed = false

# ---------------------------------------------------------------------------
# Directory classification
# ---------------------------------------------------------------------------
#
# merge = "merge_by_key" appears below only for directories covered by the CORROBORATED
# general rule (docs/VERIFY.md: "across files with different names, entries merge and the
# last-resolved definition of a key wins", agreed by Irony, CWTools and community
# documentation), plus the two directories corroborated individually (defines, traits).
#
# Directories where the only evidence is Irony's parser assignment — its whole-text
# parser, its OverwrittenObjectSingleFile parser, and localisation — are "unknown",
# because one project is one source. The likely answer is recorded in a comment so the
# probe pass has a hypothesis to test rather than a blank.

# --- Individually corroborated ------------------------------------------------

[[dir]]
glob   = "common/defines/**/*.txt"
domain = "define"
merge  = "merge_by_key"     # CORROBORATED (V16): one definition per define KEY, not per file.
merge_confidence = "corroborated"
level  = 1
# Scoring consequence: pdx.defines_overlap must fire on KEY collision, not file overlap.
# Two mods each shipping a one-key defines file with different keys is a non-event.

[[dir]]
glob   = "unchecked_defines/**/*.txt"
domain = "define"
merge  = "merge_by_key"
level  = 1

[[dir]]
glob   = "common/traits/**/*.txt"
domain = "trait"
merge  = "merge_by_key"     # CORROBORATED (V17): unit of identity is the trait id, not the file.
merge_confidence = "corroborated"
order  = "fios"             # SINGLE SOURCE (Irony, V02). Lowest-sorting filename wins here.
order_confidence = "single_source"
# The trait BODY does not merge: redefining a trait drops every vanilla key it omits.

