domain = "name_list"
merge  = "unknown"
encoding = "utf8_bom"       # SINGLE SOURCE (Irony): BOM is REQUIRED here specifically.

[[dir]]
glob   = "common/inline_scripts/**/*.txt"
domain = "inline_script"
merge  = "unknown"
# Textually substituted at parse time, so a collision here propagates into every call
# site. Treated by Irony as a first-class Stellaris mechanism.

[benign]      # never worth reporting
paths = [
  "thumbnail.png",
  "descriptor.mod",
  "readme*",
  ".git/**",
  "*.md",
  "*.editorconfig",
]
