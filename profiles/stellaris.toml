# CORROBORATED by the filename-identity rule (V15): binary assets have no key structure, so the
# only override mechanism available is same-path replacement (Stage A), which both Irony
# and CWTools resolve by root-relative path. `path_only` = no key layer; differently-named
# files never interact.

[[dir]]
