[[dir]]
glob   = "events/**/*.txt"
domain = "event"
merge  = "merge_by_key"
order  = "fios"
extractor = "pdx_event"

# --- on_actions: the design's headline risk ------------------------------------

[[dir]]
glob   = "common/on_actions/**/*.txt"
domain = "on_action"
merge  = "unknown"
# OPEN BOX: docs/VERIFY.md § Directory merge behaviour, "Additive-body directories".
#
# What IS corroborated (wiki + Irony, independently): two mods hooking the same
# on_action in DIFFERENTLY NAMED files do not conflict — the events lists accumulate and
# fire in ASCII-betical filename order. So the feared ~200-participant false High is
# indeed false and this directory must not be treated as file replacement in general.
#
# What is NOT corroborated, and why this is `unknown` rather than
# merge_by_key_additive_body: only one source names any accumulating child, and it names
# only `events`. `effect` and `random_events` are unsupported guesses. Shipping
# additive_children = ["events", "effect", "random_events"] would assert two things
# nobody has checked.
#
# additive_children = ["events"]   # <- uncomment only once a probe confirms the set.
#
# Note the exception that survives whatever the answer is: two mods both shipping
# common/on_actions/00_on_actions.txt collide on filename identity, and the loser's whole
# file — including the vanilla content it was extending — is dropped. That IS a severe
# conflict and must still be reported.

# --- Localisation ---------------------------------------------------------------

[[dir]]
glob   = "localisation/**/*.yml"
domain = "loc"
parser = "pdx_locyml"
merge  = "unknown"          # Irony parses per YAML key. Hypothesis: merge_by_key.

[[dir]]
glob   = "localisation_synced/**/*.yml"
domain = "loc_synced"
parser = "pdx_locyml"
merge  = "unknown"

[[dir]]
glob   = "localisation/replace/**/*.yml"
domain = "loc"
parser = "pdx_locyml"
merge  = "unknown"
level  = 1
# OPEN BOX: docs/VERIFY.md § Directory merge behaviour, localisation/replace item.
# SINGLE SOURCE (Irony): for a given loc key, if ANY source defines it under a `replace`
# directory then every non-replace candidate is discarded, REGARDLESS of load order.
# The unit is the individual YAML key. This is a per-key path-precedence relation the
# overlay cannot currently express; it needs one special case, not a general mechanism.
overrides_sibling = "localisation/**/*.yml"   # PROPOSED SCHEMA ADDITION

# --- Non-script trees -----------------------------------------------------------

[[dir]]
glob   = "interface/**/*.gui"
domain = "gui"
merge  = "unknown"          # No source addresses .gui merge semantics.

[[dir]]
glob   = "interface/**/*.gfx"
domain = "gui_sprite"
merge  = "unknown"

[[dir]]
glob   = "gfx/**"
domain = "asset"
parser = "none"
merge  = "file_replace"
# CORROBORATED by the filename-identity rule: binary assets have no key structure, so the
# only override mechanism available is same-path replacement, which both Irony and CWTools
# resolve by root-relative path.

[[dir]]
glob   = "sound/**"
domain = "asset"
parser = "none"
merge  = "file_replace"

[[dir]]
glob   = "music/**"
domain = "asset"
parser = "none"
merge  = "file_replace"

[[dir]]
glob   = "fonts/**"
domain = "asset"
parser = "none"
merge  = "file_replace"

[[dir]]
