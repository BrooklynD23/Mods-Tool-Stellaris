[package]
name = "smd-profiles"
description = "Game knowledge as data: the `GameProfile` trait, its TOML schema, and the shipped profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
smd-core = { workspace = true }
smd-fs = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
toml = { workspace = true }

[features]
default = ["profile-stellaris", "profile-ck3"]
# Embeds `profiles/stellaris.toml` (relative to the workspace root) into the binary.
profile-stellaris = []
# Embeds `profiles/ck3.toml`. Every value in it is UNVERIFIED (M8).
profile-ck3 = []

[lints]
workspace = true
